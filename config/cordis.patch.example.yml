# 示例：工作电脑主实例的 profile patch
# 实际路径：$DSH_HOME/profiles/web/cordis.patch.yml（$DSH_HOME = ~/.dsh）
# 凭据一律用占位符；真实 appSecret 由 QQ 扫码绑定自动写入，或走 QQBOT_APPID/QQBOT_SECRET 环境变量。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ark-agent-plan:
        displayName: Ark Agent Plan (V4.1-Flash)
        apiKeyEnv: ARK_AGENT_PLAN_API_KEY
        api: openai-completions
        baseURL: https://ark.cn-beijing.volces.com/api/plan/v3
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek-V4.1-Flash
            contextWindow: 1048576
            maxTokens: 384000
            input: [text, image]
# 自动压缩：web profile 默认禁用，这里开启（触发线 ≈ 599K）
- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  disabled: false
  config:
    thresholdRatio: 0.8
    headroomTokens: 449536
# 默认模型（volatile）：Key 就绪后由运行时自动写入，无需手工维护
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ark-agent-plan
    model: deepseek-v4.1-flash
# QQ 扫码绑定后自动写入 appId/appSecret（示例占位）
- id: im-qqbot
  config:
    appId: '<QQ_APP_ID>'
    appSecret: '<QQ_APP_SECRET>'
